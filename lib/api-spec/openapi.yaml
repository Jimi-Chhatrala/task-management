openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Task Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Task operations
  - name: statuses
    description: Task status management
  - name: attachments
    description: Task file attachments
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search in title, description, task_number
        - name: priority
          in: query
          schema:
            type: string
            enum: [lowest, low, medium, high, highest]
          description: Filter by priority
        - name: status
          in: query
          schema:
            type: string
          description: Filter by status name
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [created_at, updated_at, priority, status, production_live_date, time_spent_minutes, task_number]
          description: Sort field
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
          description: Sort order
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/stats:
    get:
      operationId: getTaskStats
      tags: [tasks]
      summary: Get task statistics
      responses:
        "200":
          description: Task stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStats"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskBody"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Soft delete a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tasks/{id}/log-time:
    post:
      operationId: logTime
      tags: [tasks]
      summary: Log time for a task (Jira-style input)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogTimeBody"
      responses:
        "200":
          description: Updated task with time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid time format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tasks/{id}/attachments:
    get:
      operationId: listTaskAttachments
      tags: [attachments]
      summary: List attachments for a task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskAttachment"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTaskAttachment
      tags: [attachments]
      summary: Register a new attachment for a task after upload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskAttachmentBody"
      responses:
        "201":
          description: Created attachment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAttachment"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tasks/{id}/attachments/{attachmentId}:
    delete:
      operationId: deleteTaskAttachment
      tags: [attachments]
      summary: Delete an attachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /statuses:
    get:
      operationId: listStatuses
      tags: [statuses]
      summary: List all task statuses
      responses:
        "200":
          description: List of statuses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskStatusConfig"
    post:
      operationId: createStatus
      tags: [statuses]
      summary: Create a new task status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatusBody"
      responses:
        "201":
          description: Created status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusConfig"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /statuses/{id}:
    patch:
      operationId: updateStatus
      tags: [statuses]
      summary: Update a task status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusBody"
      responses:
        "200":
          description: Updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusConfig"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStatus
      tags: [statuses]
      summary: Delete a task status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Cannot delete status in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Task:
      type: object
      properties:
        id:
          type: integer
        task_number:
          type: string
        task_title:
          type: string
        task_description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [lowest, low, medium, high, highest]
        status:
          type: string
        production_live_date:
          type: string
          nullable: true
        time_spent_minutes:
          type: integer
        time_spent_formatted:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      required:
        - id
        - task_number
        - task_title
        - priority
        - status
        - time_spent_minutes
        - time_spent_formatted
        - created_at
        - updated_at

    TaskAttachment:
      type: object
      properties:
        id:
          type: integer
        task_id:
          type: integer
        file_name:
          type: string
        file_size:
          type: integer
        content_type:
          type: string
        object_path:
          type: string
        created_at:
          type: string
      required:
        - id
        - task_id
        - file_name
        - file_size
        - content_type
        - object_path
        - created_at

    CreateTaskAttachmentBody:
      type: object
      properties:
        file_name:
          type: string
        file_size:
          type: integer
        content_type:
          type: string
        object_path:
          type: string
      required:
        - file_name
        - object_path

    TaskStatusConfig:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        label:
          type: string
        color:
          type: string
        position:
          type: integer
        is_default:
          type: boolean
        created_at:
          type: string
      required:
        - id
        - name
        - label
        - color
        - position
        - is_default
        - created_at

    CreateStatusBody:
      type: object
      properties:
        name:
          type: string
          description: Unique slug/key for the status (e.g. "in_review")
        label:
          type: string
          description: Human-readable label (e.g. "In Review")
        color:
          type: string
          description: Hex color code (e.g. "#3b82f6")
        position:
          type: integer
        is_default:
          type: boolean
      required:
        - name
        - label

    UpdateStatusBody:
      type: object
      properties:
        label:
          type: string
        color:
          type: string
        position:
          type: integer
        is_default:
          type: boolean

    CreateTaskBody:
      type: object
      properties:
        task_title:
          type: string
        task_description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [lowest, low, medium, high, highest]
        status:
          type: string
        production_live_date:
          type: string
          nullable: true
        time_input:
          type: string
          description: "Jira-style time input e.g. '1d 2h 30m'"
          nullable: true
      required:
        - task_title
        - priority
        - status

    UpdateTaskBody:
      type: object
      properties:
        task_number:
          type: string
        task_title:
          type: string
        task_description:
          type: string
          nullable: true
        priority:
          type: string
          enum: [lowest, low, medium, high, highest]
        status:
          type: string
        production_live_date:
          type: string
          nullable: true
        time_input:
          type: string
          description: "Jira-style time input e.g. '1d 2h 30m'. Replaces current value."
          nullable: true

    LogTimeBody:
      type: object
      properties:
        time_input:
          type: string
          description: "Jira-style time input e.g. '1d 2h 30m'. Added on top of existing time."
      required:
        - time_input

    TaskStats:
      type: object
      properties:
        total:
          type: integer
        by_priority:
          type: object
          additionalProperties:
            type: integer
        by_status:
          type: object
          additionalProperties:
            type: integer
        total_time_minutes:
          type: integer
        total_time_formatted:
          type: string
        recent_tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
      required:
        - total
        - by_priority
        - by_status
        - total_time_minutes
        - total_time_formatted
        - recent_tasks

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
